workflows:

  # ==========================================================
  # ANDROID
  # Builds:
  #   - AAB for Google Play
  #   - APK for device testing
  # ==========================================================
  android-release:
    name: Connect 3D Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze project
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk


  # ==========================================================
  # IOS
  # Builds:
  #   - IPA for App Store/TestFlight
  #
  # IMPORTANT:
  # iOS signing must be configured in Codemagic first.
  # ==========================================================
  ios-release:
    name: Connect 3D iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Analyze project
        script: |
          flutter analyze

      - name: Run tests
        script: |
          flutter test

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
